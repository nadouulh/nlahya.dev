services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "corepack enable pnpm && pnpm dev -p 3000 -H 0.0.0.0"
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env*
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml