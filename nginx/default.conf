# Language for "/": saved choice first (cookie set by the language toggle),
# then the browser's preferred language, then English
map $cookie_NEXT_LOCALE $saved_lang {
    ~^(?<saved>en|fr|it)$ $saved;
    default "";
}

map $http_accept_language $browser_lang {
    ~*^fr fr;
    ~*^it it;
    default en;
}

map $saved_lang $lang {
    "" $browser_lang;
    default $saved_lang;
}

# Language of the 404 page: the URL prefix (/fr/...) wins, then the same rules as "/"
map $uri $uri_lang {
    ~^/(?<prefix>en|fr|it)(/|$) $prefix;
    default "";
}

map $uri_lang $error_lang {
    "" $lang;
    default $uri_lang;
}

server {
    # Only reachable through the Cloudflare tunnel (127.0.0.1:PORT -> 3000)
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Relative Location headers: behind the tunnel nginx only sees http://127.0.0.1
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Built by Astro as /en/404, /fr/404 and /it/404
    error_page 404 /$error_lang/404.html;

    include /etc/nginx/security-headers.conf;

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Vary "Accept-Language, Cookie" always;
        return 307 /$lang;
    }

    # Container health check + deploy.sh health gate
    location = /api/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build assets never change
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # /fr -> fr.html (a fr/ directory also exists, for fr/404.html, so .html must come first)
        try_files $uri $uri.html $uri/ =404;
    }
}
