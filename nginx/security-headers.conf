# Included in every location that sets its own add_header: nginx drops
# inherited add_header directives as soon as a location declares one.
# HSTS is set at the Cloudflare edge, not here.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
