name: Build

on:
  push:
    branches: [main]
  # Pull requests (Dependabot) only build and scan: nothing is pushed or signed
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing (OIDC)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Image names (lowercase)
        id: image
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "commit=$repo:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build (Podman, local)
        run: podman build --pull=always -f Dockerfile -t "${{ steps.image.outputs.commit }}" .

      - name: Export image for scanning
        run: podman save -o image.tar "${{ steps.image.outputs.commit }}"

      - name: Trivy — blocking CVE scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml

      - name: Trivy — blocking secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          scanners: secret
          exit-code: "1"

      - name: Login GHCR
        if: github.event_name == 'push'
        run: podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        id: push
        run: |
          podman push --digestfile digest.txt "${{ steps.image.outputs.commit }}"
          podman tag "${{ steps.image.outputs.commit }}" "${{ steps.image.outputs.repo }}:main"
          podman push "${{ steps.image.outputs.repo }}:main"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"
          echo "Image: ${{ steps.image.outputs.repo }}@$(cat digest.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign image (keyless)
        if: github.event_name == 'push'
        run: |
          cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"
          cosign sign --yes "${{ steps.image.outputs.repo }}@${{ steps.push.outputs.digest }}"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
